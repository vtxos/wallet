# Four jobs. Three run on any runner: the FFI crate, every Dart package's analysis and tests, and
# the app under Flutter. The cosigner and the crates the FFI is built on are vtxos/cosigner's, at
# the release ffi/Cargo.toml names, and tested there; `make proto` takes its protos from the same
# checkout. The fourth is the enclave e2e — the only
# thing that proves the ceremonies end to end — against the dev enclave image
# (docker-compose.enclave.yml: enclave-runtime's QEMU enclave and that cosigner release, built by
# infra) on a hosted runner's KVM, exactly as enclave-runtime's own CI boots one. Nested
# virtualisation there works but is not something GitHub supports, so that job is the one that can
# fail for reasons outside this repository; its logs are uploaded when it does.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push's run is not worth finishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi/target
          key: rust-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-
      - name: ffi build and tests
        run: |
          cargo build --release --manifest-path ffi/Cargo.toml
          cargo test --release --manifest-path ffi/Cargo.toml
      - name: Share the FFI library with the Dart job
        uses: actions/upload-artifact@v4
        with:
          name: ffi
          retention-days: 1
          path: ffi/target/release/libmpcwallet_ffi.so

  dart:
    name: Dart (protocol, core, cli, e2e)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffi
          # Where `core/lib/threshold/src/native_library.dart` looks, walking up from cwd.
          path: ffi/target/release
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - name: Install protoc and the Dart plugin
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          # Pinned: the generator must match the protobuf runtime `protocol` pins (^3.1.0). The
          # latest plugin emits code for protobuf 6, which does not analyze against 3.
          dart pub global activate protoc_plugin 21.1.2
      # The generated Dart is not checked in.
      - name: Generate protocol stubs
        run: make proto
      - name: Analyze every package
        run: |
          for pkg in protocol core cli e2e; do
            (cd $pkg && dart pub get && dart analyze)
          done
      - name: core tests
        run: cd core && dart test

  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install protoc and the Dart plugin
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          # Pinned: the generator must match the protobuf runtime `protocol` pins (^3.1.0). The
          # latest plugin emits code for protobuf 6, which does not analyze against 3.
          dart pub global activate protoc_plugin 21.1.2
      - name: Generate protocol stubs
        run: make proto
      - name: Analyze and test
        run: |
          cd app
          flutter pub get
          # Infos are style, and there are a few dozen pre-existing ones; errors and warnings fail.
          flutter analyze --no-fatal-infos
          flutter test

  enclave-e2e:
    name: Enclave e2e (dev enclave image, KVM)
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The FFI comes from the rust job; do not build it again.
      FFI_DEP: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffi
          path: ffi/target/release
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - name: Install protoc and the Dart plugin
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          # Pinned: the generator must match the protobuf runtime `protocol` pins (^3.1.0). The
          # latest plugin emits code for protobuf 6, which does not analyze against 3.
          dart pub global activate protoc_plugin 21.1.2
      - name: Let this user open KVM, and load the vsock loopback transport
        # What enclave-runtime's scripts/ci-e2e.sh does on the same runners: /dev/kvm exists but is
        # root-owned, and the harness forwards the enclave's vsock to host loopback.
        run: |
          if [ -e /dev/kvm ] && [ ! -r /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          [ -e /dev/vsock ] || sudo modprobe vsock_loopback
      - name: The protocol stubs
        run: make proto
      - name: The suite, against the enclave
        run: make e2e-enclave E2E_TIMEOUT=30m
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: enclave-e2e-logs
          path: .enclave-run/bundle/target/qemu-nitro/vtxos/*.log
