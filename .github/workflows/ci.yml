# Four jobs. Three run on any runner: the FFI crate, every Dart package's analysis and tests, and
# the app under Flutter. The cosigner and the crates the FFI is built on are vtxos/cosigner's, at
# the release ffi/Cargo.toml names, and tested there; `make proto` takes its protos from the same
# checkout.
#
# The fourth is every e2e (scripts/e2e-all.sh), from an Android emulator against one dev enclave:
# the image infra builds (docker-compose.enclave.yml: the runtime's QEMU enclave and that cosigner
# release), booted on a hosted runner's KVM as the runtime's own CI boots one, with MerlinPlatform
# beside it. The app's full flow through its screens, then the wallet against the cosigner — the
# ceremonies, and every refusal — with every passkey through Credential Manager to a test provider.
# Nested virtualisation works there but is not something GitHub supports, so this is the job that
# can fail for reasons outside this repository; its logs are uploaded when it does.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push's run is not worth finishing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi/target
          key: rust-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-
      - name: ffi build and tests
        run: |
          cargo build --release --manifest-path ffi/Cargo.toml
          cargo test --release --manifest-path ffi/Cargo.toml
      - name: Share the FFI library with the Dart job
        uses: actions/upload-artifact@v4
        with:
          name: ffi
          retention-days: 1
          path: ffi/target/release/libmpcwallet_ffi.so

  dart:
    name: Dart (protocol, core, cli, e2e)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffi
          # Where `core/lib/threshold/src/native_library.dart` looks, walking up from cwd.
          path: ffi/target/release
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
      - name: Install protoc and the Dart plugin
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          # Pinned: the generator must match the protobuf runtime `protocol` pins (^3.1.0). The
          # latest plugin emits code for protobuf 6, which does not analyze against 3.
          dart pub global activate protoc_plugin 21.1.2
      # The generated Dart is not checked in.
      - name: Generate protocol stubs
        run: make proto
      - name: Analyze every package
        run: |
          for pkg in protocol core cli e2e; do
            (cd $pkg && dart pub get && dart analyze)
          done
      - name: core tests
        run: cd core && dart test

  flutter:
    name: Flutter (analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: the Flutter the app is built with. Stable moves on its own, and 3.47 refuses this
      # project's Gradle 8.12 — moving to it means the Gradle and AGP upgrade it asks for.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.3'
      - name: Install protoc and the Dart plugin
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          # Pinned: the generator must match the protobuf runtime `protocol` pins (^3.1.0). The
          # latest plugin emits code for protobuf 6, which does not analyze against 3.
          dart pub global activate protoc_plugin 21.1.2
      - name: Generate protocol stubs
        run: make proto
      - name: Analyze and test
        run: |
          cd app
          flutter pub get
          # Infos are style, and there are a few dozen pre-existing ones; errors and warnings fail.
          flutter analyze --no-fatal-infos
          flutter test

  e2e:
    name: E2E (the app and the wallet, on an emulator; enclave and platform)
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The host FFI comes from the rust job; do not build it again.
      FFI_DEP: ""
    steps:
      - uses: actions/checkout@v4
      # MerlinPlatform, for the payout. scripts/platform.sh refuses one built against another
      # cosigner release than ffi/'s.
      - uses: actions/checkout@v4
        with:
          repository: vtxos/platform
          path: platform
      - name: Make room for an emulator, Gradle and the stack's images
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Pinned: the Flutter the app is built with. Stable moves on its own, and 3.47 refuses this
      # project's Gradle 8.12 — moving to it means the Gradle and AGP upgrade it asks for.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.3'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ffi/target/x86_64-linux-android
            .platform/build/target
          key: e2e-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: e2e-
      - uses: actions/download-artifact@v4
        with:
          name: ffi
          path: ffi/target/release
      - name: Install protoc and the Dart plugin
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          # Pinned: the generator must match the protobuf runtime `protocol` pins (^3.1.0). The
          # latest plugin emits code for protobuf 6, which does not analyze against 3.
          dart pub global activate protoc_plugin 21.1.2
      - name: The protocol stubs
        run: make proto
      - name: Let this user open KVM, and load the vsock loopback transport
        # What the runtime's scripts/ci-e2e.sh does on the same runners: /dev/kvm exists but is
        # root-owned, and the harness forwards the enclave's vsock to host loopback. The emulator
        # and the enclave's QEMU both run on it.
        run: |
          if [ -e /dev/kvm ] && [ ! -r /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          [ -e /dev/vsock ] || sudo modprobe vsock_loopback
      # The runner is 16 GB for an emulator, the enclave's VM, the regtest stack and Gradle: a daemon
      # that outlives each build holds 4 GB for nothing.
      - name: Gradle without a daemon
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.daemon=false\nkotlin.compiler.execution.strategy=in-process\n' >> ~/.gradle/gradle.properties
      # The image Play services draws Credential Manager's sheet on, as on a phone. Without Wi-Fi:
      # the emulator's is netsim's, which on a runner comes up with no route even to the host at
      # 10.0.2.2 ("Network is unreachable"); mobile data is the emulator's own network, and has one.
      - name: On an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          # A phone's screen. The default device is a small one, where the app's buttons can sit
          # under the keyboard or off the bottom, out of reach of a tap.
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Wifi
          script: make e2e-all NDK_HOME="$ANDROID_NDK_LATEST_HOME" MERLIN_PLATFORM="$GITHUB_WORKSPACE/platform"
      # What the kernel did, the OOM killer above all, for a run that stopped without a word.
      - name: The kernel's log
        if: failure()
        run: sudo dmesg -T | tail -400 > .enclave-run/dmesg.txt || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: |
            .enclave-run/bundle/target/qemu-nitro/vtxos/*.log
            .enclave-run/logcat.txt
            .enclave-run/*_test.log
            .enclave-run/health.txt
            .enclave-run/dmesg.txt
            .platform/run/*.log
