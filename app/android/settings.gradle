pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.3" apply false
    // Bumped for Flutter 3.44.3 (fails under Gradle 7.x) and androidx.credentials
    // 1.3.0 (needs Kotlin >=1.9.0 stdlib metadata).
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
    // Firebase Cloud Messaging — needs google-services.json in app/.
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
// A software passkey provider for the emulator e2e, never part of the app: see testpasskey/src/main/kotlin.
include ":testpasskey"
